<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>InkShelfs</title>
  <script>
    // Paint the saved theme before anything renders (no flash).
    try { var t = localStorage.getItem('na-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="manga.css">
</head>
<body>
  <a class="sr-only" href="#main">Skip to content</a>

  <header class="top">
    <div class="top__in">
      <a class="brand" href="#/" aria-label="InkShelfs library">
        <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#1D1B18"/><path d="M14 14h15a3 3 0 0 1 3 3v33H17a3 3 0 0 1-3-3z" fill="#F7F3EC"/><path d="M32 17a3 3 0 0 1 3-3h15v33a3 3 0 0 1-3 3H32z" fill="#E9DFCE"/><path d="M37 20h9v10h-9zM37 33h9v12h-9z" fill="#1D1B18"/><path d="M18 21h10M18 27h10M18 33h7" stroke="#B5AC9E" stroke-width="2.4" stroke-linecap="round"/><circle cx="48" cy="48" r="7" fill="#A8431F"/></svg>
        <span>InkShelfs</span>
      </a>
      <label class="field search" id="searchBox">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="librarySearch" placeholder="Search your library" aria-label="Search your library" autocomplete="off">
        <kbd class="only-wide">Ctrl K</kbd>
      </label>
      <button type="button" class="icon-btn" id="searchToggle" aria-label="Search your library" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <button type="button" class="mjobs-pill" id="mjobsPill" hidden aria-haspopup="dialog"></button>
      <a class="icon-btn" id="sitesBtn" href="#/sites" aria-label="Supported sites" title="Supported sites">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      </a>
      <button type="button" class="icon-btn" id="themeBtn" aria-label="Switch theme"></button>
      <a class="icon-btn" id="settingsBtn" href="#/settings" aria-label="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></svg>
      </a>
    </div>
  </header>

  <main id="main" class="view" tabindex="-1"></main>

  <div class="toasts" id="toasts" role="region" aria-label="Notifications" aria-live="polite"></div>
  <div id="overlay"></div>

  <script src="android-shim.js"></script>
  <script src="manga.js"></script>
  <script src="app.js"></script>
</body>
</html>
